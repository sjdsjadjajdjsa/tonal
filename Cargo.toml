[package]
name = "tonal"
version = "0.1.0"
edition = "2024"
description = "A lightweight native music player. Rust, Slint, mpv."
license = "MIT"
repository = "https://github.com/sjdsjadjajdjsa/tonal"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.41"
directories = "6"
souvlaki = "0.9"
lofty = "0.25"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
url = "2"
open = "5"
md-5 = "0.11"
walkdir = "2"
futures = "0.3"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
parking_lot = "0.13"
rustfft = { version = "6.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true
