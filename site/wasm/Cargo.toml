[package]
name = "tonal-scenes"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
strip = true

[workspace]
