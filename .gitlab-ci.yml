# Pushes to main and merge requests run the checks on Linux. A tag like v1.2.0 builds
# Tonal for Linux, Windows and macOS and publishes them as the GitLab release for that
# tag; the tag must match the version in Cargo.toml. Linux and Windows run on GitLab's
# hosted runners, macOS on a runner tagged "tonal-macos" (see packaging/macos/RUNNER.md).

stages: [check, build, publish]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  CARGO_TERM_COLOR: always
  PACKAGES: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/tonal

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rust-linux:
  image: ubuntu:22.04
  variables:
    DEBIAN_FRONTEND: noninteractive
  cache:
    key: $CI_JOB_NAME
    paths: [.cargo/registry, .cargo/git, target]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl file git build-essential pkg-config libsqlite3-dev libdbus-1-dev libasound2-dev libfontconfig-dev libxkbcommon-dev $EXTRA_PACKAGES > /dev/null
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy,rustfmt
    - export PATH="$CARGO_HOME/bin:$PATH"

check:
  extends: .rust-linux
  image: ubuntu:24.04
  stage: check
  rules:
    - if: $CI_COMMIT_TAG == null
  variables:
    EXTRA_PACKAGES: mpv xvfb imagemagick libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
  script:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
    - xvfb-run -a -s "-screen 0 1280x800x24" tools/ui-smoke.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [target/ui-smoke/*.png]

.release-tag:
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    TONAL_DISCORD_APP: $DISCORD_APP_ID

version:
  stage: check
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
    - '[ "v$version" = "$CI_COMMIT_TAG" ] || { echo "Tag $CI_COMMIT_TAG but Cargo.toml says $version"; exit 1; }'

linux:
  extends: [.rust-linux, .release-tag]
  stage: build
  script:
    - packaging/linux/build-appimage.sh
    - mkdir -p dist/tonal
    - cp target/release/tonal target/appimage/yt-dlp README.md LICENSE THIRD-PARTY-NOTICES.md dist/tonal/
    - cp ui/fonts/Inter-LICENSE.txt dist/tonal/FONTS-LICENSE.txt
    - cp packaging/linux/tonal.desktop ui/icon.png dist/tonal/
    - tar czf tonal-linux-x86_64.tar.gz -C dist tonal
  artifacts:
    paths: [tonal-linux-x86_64.tar.gz, tonal-x86_64.AppImage, tonal-x86_64.AppImage.zsync]

windows:
  extends: .release-tag
  stage: build
  tags: [saas-windows-medium-amd64]
  cache:
    key: $CI_JOB_NAME
    paths: [.cargo/registry, .cargo/git, target]
  script:
    - Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
    - .\rustup-init.exe -y --profile minimal
    - $env:Path = "$env:CARGO_HOME\bin;$env:Path"
    - choco install innosetup -y --no-progress
    - $env:Path = "${env:ProgramFiles(x86)}\Inno Setup 6;$env:Path"
    - cargo build --release --features bundled-sqlite
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - New-Item -ItemType Directory dist/tonal -Force | Out-Null
    - Copy-Item target/release/tonal.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.md dist/tonal/
    - Copy-Item ui/fonts/Inter-LICENSE.txt dist/tonal/FONTS-LICENSE.txt
    - ./packaging/windows/fetch-tools.ps1 dist/tonal
    - $version = $env:CI_COMMIT_TAG.TrimStart("v")
    - iscc /Q "/DVersion=$version" "/DSource=$env:CI_PROJECT_DIR\dist\tonal" packaging\windows\tonal.iss
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - New-Item -ItemType File dist/tonal/portable | Out-Null
    - Compress-Archive -Path dist/tonal -DestinationPath tonal-windows-x86_64.zip
  artifacts:
    paths: [tonal-setup-x86_64.exe, tonal-windows-x86_64.zip]

macos:
  extends: .release-tag
  stage: build
  tags: [tonal-macos]
  script:
    - export CARGO_HOME="$HOME/.cargo" PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
    - TONAL_NO_INSTALL=1 sh packaging/macos/build-app.sh
    - rm -rf dist && mkdir -p dist/Tonal
    - cp -R target/release/Tonal.app dist/Tonal/
    - ln -s /Applications dist/Tonal/Applications
    - cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/Tonal/
    - cp ui/fonts/Inter-LICENSE.txt dist/Tonal/FONTS-LICENSE.txt
    - hdiutil create -volname Tonal -srcfolder dist/Tonal -ov -format UDZO tonal-macos-arm64.dmg
    - hdiutil verify tonal-macos-arm64.dmg
  artifacts:
    paths: [tonal-macos-arm64.dmg]

upload:
  stage: publish
  image: alpine:3.22
  rules:
    - if: $CI_COMMIT_TAG
  needs: [version, linux, windows, macos]
  script:
    - apk add --no-cache curl coreutils > /dev/null
    - sha256sum tonal-* | tee SHA256SUMS
    - version=${CI_COMMIT_TAG#v}
    - |
      for file in tonal-* SHA256SUMS; do
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$PACKAGES/$CI_COMMIT_TAG/$file" > /dev/null
      done
    - awk -v v="## $version " 'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
  artifacts:
    paths: [notes.md]

release:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [upload]
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Tonal $CI_COMMIT_TAG
    description: notes.md
    assets:
      links:
        - { name: tonal-macos-arm64.dmg, url: "$PACKAGES/$CI_COMMIT_TAG/tonal-macos-arm64.dmg", filepath: /tonal-macos-arm64.dmg, link_type: package }
        - { name: tonal-setup-x86_64.exe, url: "$PACKAGES/$CI_COMMIT_TAG/tonal-setup-x86_64.exe", filepath: /tonal-setup-x86_64.exe, link_type: package }
        - { name: tonal-windows-x86_64.zip, url: "$PACKAGES/$CI_COMMIT_TAG/tonal-windows-x86_64.zip", filepath: /tonal-windows-x86_64.zip, link_type: package }
        - { name: tonal-x86_64.AppImage, url: "$PACKAGES/$CI_COMMIT_TAG/tonal-x86_64.AppImage", filepath: /tonal-x86_64.AppImage, link_type: package }
        - { name: tonal-x86_64.AppImage.zsync, url: "$PACKAGES/$CI_COMMIT_TAG/tonal-x86_64.AppImage.zsync", filepath: /tonal-x86_64.AppImage.zsync, link_type: package }
        - { name: tonal-linux-x86_64.tar.gz, url: "$PACKAGES/$CI_COMMIT_TAG/tonal-linux-x86_64.tar.gz", filepath: /tonal-linux-x86_64.tar.gz, link_type: package }
        - { name: SHA256SUMS, url: "$PACKAGES/$CI_COMMIT_TAG/SHA256SUMS", filepath: /SHA256SUMS, link_type: other }
