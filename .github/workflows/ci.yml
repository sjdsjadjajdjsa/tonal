name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libdbus-1-dev libfontconfig-dev libxkbcommon-dev mpv
      - name: System tools
        if: runner.os == 'macOS'
        run: brew install mpv
      - run: cargo fmt --check
      - name: Unused dependencies
        if: runner.os == 'Linux'
        uses: bnjbvr/cargo-machete@v0.9.2
      - run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        if: runner.os != 'Windows'
        run: cargo test
      - name: App bundle
        if: runner.os == 'macOS'
        run: |
          sh packaging/macos/build-app.sh
          codesign --verify /Applications/Tonal.app
          plutil -lint /Applications/Tonal.app/Contents/Info.plist
          # Same steps as the macOS pack in release.yml.
          TONAL_NO_INSTALL=1 sh packaging/macos/build-app.sh
          mkdir -p dist/Tonal
          cp -R target/release/Tonal.app dist/Tonal/
          ln -s /Applications dist/Tonal/Applications
          cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/Tonal/
          cp ui/fonts/Inter-LICENSE.txt dist/Tonal/FONTS-LICENSE.txt
          hdiutil create -volname Tonal -srcfolder dist/Tonal -ov -format UDZO tonal-macos-arm64.dmg
          hdiutil verify tonal-macos-arm64.dmg
      - name: Stable signing
        if: runner.os == 'macOS'
        env:
          TONAL_KEYCHAIN: ${{ runner.temp }}/tonal-ci.keychain-db
          TONAL_KEYCHAIN_PASSWORD: ci
        run: |
          security create-keychain -p "$TONAL_KEYCHAIN_PASSWORD" "$TONAL_KEYCHAIN"
          security set-keychain-settings "$TONAL_KEYCHAIN"
          security unlock-keychain -p "$TONAL_KEYCHAIN_PASSWORD" "$TONAL_KEYCHAIN"
          security list-keychains -d user -s "$TONAL_KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          sh packaging/macos/setup-signing.sh
          sh packaging/macos/setup-signing.sh
          security find-identity -p codesigning
          sh packaging/macos/build-app.sh
          first=$(codesign -d -r- /Applications/Tonal.app 2>&1 | grep '^designated')
          codesign --verify --deep --strict /Applications/Tonal.app
          sh packaging/macos/build-app.sh
          second=$(codesign -d -r- /Applications/Tonal.app 2>&1 | grep '^designated')
          codesign --verify --deep --strict /Applications/Tonal.app
          codesign -dvv /Applications/Tonal.app 2>&1 | grep -E '^(Identifier|Authority|CDHash)'
          echo "first:  $first"
          echo "second: $second"
          [ "$first" = "$second" ]
          case "$first" in *cdhash*) exit 1 ;; esac
          case "$first" in *'identifier "io.github.sjdsjadjajdjsa.tonal"'*certificate*) ;; *) exit 1 ;; esac
          security delete-keychain "$TONAL_KEYCHAIN"
      - name: Tests (no mpv)
        if: runner.os == 'Windows'
        run: cargo test -- --skip real_mpv
      - name: Installer script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/tonal -Force | Out-Null
          Copy-Item README.md, LICENSE dist/tonal/
          New-Item -ItemType File dist/tonal/tonal.exe | Out-Null
          # The zip's portable marker must stay out of the installer (Excludes in tonal.iss).
          New-Item -ItemType File dist/tonal/portable | Out-Null
          iscc /Q "/DSource=$env:GITHUB_WORKSPACE\dist\tonal" packaging\windows\tonal.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libdbus-1-dev libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 xvfb imagemagick mpv
      - name: Every view renders
        run: xvfb-run -a -s "-screen 0 1280x800x24" tools/ui-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke
          path: target/ui-smoke/*.png
