name: ci

# Pushes to main and pull requests: format, lint and tests on Linux and macOS, and a
# check that every main view of the real app renders.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libdbus-1-dev libasound2-dev libfontconfig-dev libxkbcommon-dev mpv
      - name: System tools
        if: runner.os == 'macOS'
        run: brew install mpv
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libdbus-1-dev libasound2-dev libfontconfig-dev libxkbcommon-dev libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 xvfb imagemagick mpv
      - name: Every view renders
        run: xvfb-run -a -s "-screen 0 1280x800x24" tools/ui-smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke
          path: target/ui-smoke/*.png
