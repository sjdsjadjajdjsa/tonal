name: release

# Push a tag like v0.1.0 and this builds Tonal for Linux, Windows and macOS and puts
# the downloads on the GitHub release for that tag. The tag must match the
# version in Cargo.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu LTS so the program runs on
          # any distribution with glibc 2.35 or newer.
          - os: ubuntu-24.04
            container: ubuntu:22.04
            assets: |
              tonal-linux-x86_64.tar.gz
              tonal-x86_64.AppImage
              tonal-x86_64.AppImage.zsync
          - os: windows-latest
            assets: |
              tonal-setup-x86_64.exe
              tonal-windows-x86_64.zip
          # Apple Silicon. Uses the system SQLite.
          - os: macos-latest
            assets: |
              tonal-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: System libraries
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl file git build-essential pkg-config libdbus-1-dev libfontconfig-dev libxkbcommon-dev
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check the tag against Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG but Cargo.toml says $version"
            exit 1
          fi
      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --features bundled-sqlite
      - name: AppImage
        if: runner.os == 'Linux'
        run: packaging/linux/build-appimage.sh
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/tonal
          cp target/release/tonal target/appimage/yt-dlp README.md LICENSE THIRD-PARTY-NOTICES.md dist/tonal/
          cp ui/fonts/Inter-LICENSE.txt dist/tonal/FONTS-LICENSE.txt
          cp packaging/linux/tonal.desktop ui/icon.png dist/tonal/
          tar czf tonal-linux-x86_64.tar.gz -C dist tonal
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/tonal -Force | Out-Null
          Copy-Item target/release/tonal.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.md dist/tonal/
          Copy-Item ui/fonts/Inter-LICENSE.txt dist/tonal/FONTS-LICENSE.txt
          ./packaging/windows/fetch-tools.ps1 dist/tonal
          $version = $env:TAG.TrimStart("v")
          iscc /Q "/DVersion=$version" "/DSource=$env:GITHUB_WORKSPACE\dist\tonal" packaging\windows\tonal.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Only the zip is portable: it keeps its data next to tonal.exe.
          New-Item -ItemType File dist/tonal/portable | Out-Null
          Compress-Archive -Path dist/tonal -DestinationPath tonal-windows-x86_64.zip
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: |
          TONAL_NO_INSTALL=1 sh packaging/macos/build-app.sh
          mkdir -p dist/Tonal
          cp -R target/release/Tonal.app dist/Tonal/
          ln -s /Applications dist/Tonal/Applications
          cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/Tonal/
          cp ui/fonts/Inter-LICENSE.txt dist/Tonal/FONTS-LICENSE.txt
          hdiutil create -volname Tonal -srcfolder dist/Tonal -ov -format UDZO tonal-macos-arm64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.assets }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum tonal-* | tee SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" tonal-* SHA256SUMS --repo "$REPO" --clobber
          else
            gh release create "$TAG" tonal-* SHA256SUMS --repo "$REPO" --title "Tonal $TAG" --generate-notes
          fi
